# flutter-remote:managed sha256=338fe3b504786968 — generated by flutter-remote; edits are kept, `flutter-remote init --force` restores it
# This workflow runs a Flutter iOS app in a macOS runner and streams it to a browser.
name: flutter-remote
run-name: flutter-remote ${{ inputs.session }} · ${{ inputs.mode }} · ${{ inputs.minutes }}m

on:
  workflow_dispatch:
    inputs:
      session:
        description: Session ID (auto-generated)
        required: true
      gate_token:
        description: One-time token to access the gate server
        required: true
      minutes:
        description: Maximum session duration in minutes (runner timeout)
        default: "10"
      device:
        description: Simulator device name
        default: iPhone 17 Pro
      mode:
        description: build (compile Flutter from source) or app (prebuilt .app)
        default: build
      flutter_version:
        description: Flutter version or channel (e.g. 3.29.0 or stable)
        default: stable
      build_mode:
        description: "Flutter build mode (iOS Simulator only supports debug)"
        default: debug
      flavor:
        description: Flutter flavor
        default: ""
      target:
        description: Flutter target entrypoint
        default: ""
      dart_defines:
        description: Comma-separated list of DART_DEFINES (KEY=VALUE)
        default: ""
      app_url:
        description: URL of a prebuilt simulator .app archive (mode:app)
        default: ""
      app_release_asset:
        description: Asset name on this repo's flutter-remote-build release (mode:app)
        default: ""
      transport:
        description: webrtc (default, V2 architecture) or http (legacy V1)
        default: webrtc
      codec:
        description: "Stream codec: 'mjpeg' (default, stable) or 'auto' (falls back to mjpeg)"
        default: mjpeg
      tunnel_protocol:
        description: "Cloudflare tunnel protocol: 'quic' (recommended, UDP-based, better on lossy networks) or 'http2'"
        default: quic
      max_dimension:
        description: Longest side of the picture sent to the browser, in pixels (0 = full size)
        default: "960"
      video_fps:
        description: Most frames per second sent to the browser
        default: "24"
      video_quality:
        description: Picture quality sent to the browser, 0.05-1
        default: "0.6"
      export_app:
        description: Upload the built .app as a GitHub Actions artifact
        default: "false"
      agent_device:
        description: Enable agent-device proxy at /agent-device
        default: "false"
      agent_device_version:
        description: agent-device version to install
        default: 0.20.1
      cache:
        description: Reuse fingerprint-matched .app instead of rebuilding natively
        default: "true"
      runner:
        description: macOS runner label (must be ARM64 for serve-sim)
        default: macos-26

permissions:
  contents: read
  statuses: write

concurrency:
  group: flutter-remote-${{ inputs.session }}
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_CONTEXT: flutter-remote/${{ inputs.session }}
      GATE_PORT: "3199"
      PREVIEW_PORT: "3200"
      AGENT_PORT: "4310"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version != 'stable' && inputs.flutter_version || '' }}
          channel: ${{ inputs.flutter_version == 'stable' && 'stable' || '' }}
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: flutter-remote-pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: flutter-remote-pods-${{ runner.os }}-

      - name: Cache cloudflared binary
        id: cloudflared-cache
        uses: actions/cache@v4
        with:
          path: cloudflared
          key: flutter-remote-cloudflared-darwin-arm64-latest

      - name: Cache serve-sim npm package
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: flutter-remote-serve-sim-${{ runner.os }}-latest
          restore-keys: flutter-remote-serve-sim-${{ runner.os }}-

      - name: Fingerprint Flutter build inputs
        id: fp
        if: inputs.mode == 'build' && inputs.cache == 'true'
        run: |
          set -euo pipefail
          SOURCE_HASH=$(find pubspec.yaml pubspec.lock lib ios -type f 2>/dev/null \
            | sort \
            | xargs shasum -a 256 2>/dev/null \
            | shasum -a 256 \
            | awk '{print $1}')
          BUILD_KEY="signed-v1-${SOURCE_HASH}-${{ inputs.runner }}-${{ inputs.flutter_version }}-${{ inputs.build_mode }}-${{ inputs.flavor }}-${{ inputs.target }}-${{ inputs.dart_defines }}"
          FULL_HASH=$(printf '%s' "$BUILD_KEY" | shasum -a 256 | awk '{print substr($1, 1, 16)}')
          echo "hash=$FULL_HASH" >> "$GITHUB_OUTPUT"
          echo "Flutter build cache fingerprint: $FULL_HASH"

      - name: Restore cached app build
        id: appcache
        if: inputs.mode == 'build' && inputs.cache == 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/flutter-remote-app
          key: flutter-remote-app-${{ runner.os }}-${{ steps.fp.outputs.hash }}

      - name: Boot iOS Simulator
        id: sim
        timeout-minutes: 10
        run: |
          set -euo pipefail
          DEVICE='${{ inputs.device }}'

          UDID=$(xcrun simctl list devices available \
            | grep -F "$DEVICE (" \
            | head -1 \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' || true)

          if [ -z "$UDID" ]; then
            echo "::warning::Requested device '$DEVICE' was not available on this runner."
            FALLBACK_NAME=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | tail -1 | sed -E 's/^\s+([^()]+)\s+\(.*/\1/')
            echo "::warning::Using fallback device: $FALLBACK_NAME"
            UDID=$(xcrun simctl list devices available \
              | grep -E '^\s+iPhone' \
              | tail -1 \
              | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          fi

          [ -n "$UDID" ] || { echo "::error::No iOS simulator available on this runner image"; exit 1; }

          echo "Booting iOS Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "iOS Simulator is booted and ready."

      - name: Start serve-sim
        id: serve_sim
        timeout-minutes: 10
        run: |
          set -euo pipefail

          CODEC='${{ inputs.codec }}'
          if [ "$CODEC" = "auto" ]; then
            echo "Normalizing codec 'auto' to 'mjpeg' for stable WebRTC pipeline"
            CODEC="mjpeg"
          fi
          ARGS=(
            --detach
            --quiet
            --fit
            --panes none
            --port "$PREVIEW_PORT"
            --codec "$CODEC"
          )

          echo "Starting serve-sim with codec=$CODEC args: ${ARGS[*]}"
          SERVE_SIM_OUT=$(npx --yes serve-sim "${ARGS[@]}" "${{ steps.sim.outputs.udid }}" || true)
          echo "serve-sim raw output: $SERVE_SIM_OUT"

          for i in {1..30}; do
            if nc -z 127.0.0.1 "$PREVIEW_PORT" 2>/dev/null; then break; fi
            sleep 0.2
          done
          echo "serve-sim started on port $PREVIEW_PORT"

          # Extract streamUrl if reported by serve-sim, otherwise derive from simulator UDID
          STREAM_PATH=$(node -e '
            const out = process.argv[1] || "";
            const udid = process.argv[2] || "";
            let streamUrl = "";
            try {
              const parsed = JSON.parse(out);
              streamUrl = parsed.streamUrl || parsed.url || "";
            } catch {
              const match = out.match(/"streamUrl"\s*:\s*"([^"]+)"/) || out.match(/http:\/\/[^\s]+/);
              if (match) streamUrl = match[1] || match[0];
            }
            if (streamUrl) {
              try {
                const u = new URL(streamUrl);
                let p = u.pathname;
                if (!p.includes("stream.mjpeg")) {
                  p = p.replace(/\/?$/, "/stream.mjpeg");
                }
                p += (p.includes("?") ? "&" : "?") + "raw=1";
                console.log(p);
                process.exit(0);
              } catch {}
            }
            if (udid) {
              console.log(`/helper/${udid}/stream.mjpeg?raw=1`);
            } else {
              console.log("/stream.mjpeg?raw=1");
            }
          ' "$SERVE_SIM_OUT" "${{ steps.sim.outputs.udid }}")

          echo "Derived stream path: $STREAM_PATH"
          echo "stream_path=$STREAM_PATH" >> "$GITHUB_OUTPUT"
          echo "FLUTTER_REMOTE_STREAM_PATH=$STREAM_PATH" >> "$GITHUB_ENV"

          # serve-sim's input socket is /helper/<udid>/ws (binary frames), not /ws.
          # Use the wsUrl serve-sim reports; when it reports none, the peer derives
          # it from the stream path.
          INPUT_PATH=$(node -e '
            const out = process.argv[1] || "";
            let ws = "";
            try { ws = JSON.parse(out).wsUrl || ""; } catch {
              const m = out.match(/"wsUrl"\s*:\s*"([^"]+)"/);
              if (m) ws = m[1];
            }
            try { if (ws) console.log(new URL(ws).pathname); } catch {}
          ' "$SERVE_SIM_OUT")
          echo "Input socket path: ${INPUT_PATH:-<derived from stream path>}"
          echo "input_path=$INPUT_PATH" >> "$GITHUB_OUTPUT"

      - name: Install WebRTC peer dependencies
        timeout-minutes: 5
        run: |
          set -euo pipefail
          echo "Installing WebRTC peer dependencies (node-datachannel, ws, ffmpeg-static)..."
          npm install -g node-datachannel@0.33.4 ws@8.18.0 ffmpeg-static@5.3.0 --prefer-offline

      - name: Start WebRTC peer
        timeout-minutes: 5
        env:
          FLUTTER_REMOTE_TARGET_PORT: ${{ env.PREVIEW_PORT }}
          FLUTTER_REMOTE_WEBRTC_SIGNAL_PORT: "3201"
          FLUTTER_REMOTE_TRANSPORT: ${{ inputs.transport }}
          FLUTTER_REMOTE_STREAM_PATH: ${{ steps.serve_sim.outputs.stream_path || env.FLUTTER_REMOTE_STREAM_PATH || format('/helper/{0}/stream.mjpeg?raw=1', steps.sim.outputs.udid) }}
          FLUTTER_REMOTE_INPUT_PATH: ${{ steps.serve_sim.outputs.input_path }}
          FLUTTER_REMOTE_MAX_DIMENSION: ${{ inputs.max_dimension }}
        run: |
          set -euo pipefail
          export NODE_PATH="$(npm root -g)"
          PEER_PATH=".github/flutter-remote/webrtc-peer.cjs"
          if [ ! -f "$PEER_PATH" ]; then
            PEER_PATH="src/runner/flutter-remote/webrtc-peer.cjs"
          fi
          nohup node "$PEER_PATH" > webrtc-peer.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 3201 2>/dev/null; then break; fi
            sleep 0.2
          done
          echo "WebRTC peer bridge running on port 3201"
          echo "--- WebRTC peer startup log ---"
          cat webrtc-peer.log || true
          echo "--- End WebRTC peer startup log ---"

      - name: Start auth gate
        timeout-minutes: 5
        env:
          FLUTTER_REMOTE_GATE_TOKEN: ${{ inputs.gate_token }}
          FLUTTER_REMOTE_GATE_PORT: ${{ env.GATE_PORT }}
          FLUTTER_REMOTE_TARGET_PORT: ${{ env.PREVIEW_PORT }}
          FLUTTER_REMOTE_AGENT_PORT: ${{ inputs.agent_device == 'true' && env.AGENT_PORT || '' }}
          FLUTTER_REMOTE_TURN_KEY_ID: ${{ secrets.FLUTTER_REMOTE_TURN_KEY_ID }}
          FLUTTER_REMOTE_TURN_KEY_TOKEN: ${{ secrets.FLUTTER_REMOTE_TURN_KEY_TOKEN }}
          FLUTTER_REMOTE_WEBRTC_SIGNAL_PORT: "3201"
          FLUTTER_REMOTE_TRANSPORT: ${{ inputs.transport }}
          # serve-sim's viewer gets scaled, de-duplicated, rate-capped frames (stream-relay.cjs).
          FLUTTER_REMOTE_MAX_DIMENSION: ${{ inputs.max_dimension }}
          FLUTTER_REMOTE_VIDEO_FPS: ${{ inputs.video_fps }}
          FLUTTER_REMOTE_VIDEO_QUALITY: ${{ inputs.video_quality }}
        run: |
          set -euo pipefail
          # The relay scales frames with the ffmpeg-static installed for the peer.
          export NODE_PATH="$(npm root -g)"
          GATE_PATH=".github/flutter-remote/gate.cjs"
          if [ ! -f "$GATE_PATH" ]; then
            GATE_PATH="src/runner/flutter-remote/gate.cjs"
          fi
          nohup node "$GATE_PATH" > gate.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:$GATE_PORT/__flutter-remote/healthz" 2>/dev/null; then break; fi
            sleep 0.5
          done
          echo "Auth gate proxy running on port $GATE_PORT"
          cat gate.log || true

      - name: Open tunnel and publish URL
        timeout-minutes: 10
        id: tunnel
        run: |
          set -euo pipefail

          # Download cloudflared only if not restored from cache
          if [ ! -f cloudflared ]; then
            echo "Downloading cloudflared tunnel client..."
            curl -fsSL -o cloudflared.tgz https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
            tar -xzf cloudflared.tgz
            rm -f cloudflared.tgz
          else
            echo "cloudflared restored from cache, skipping download"
          fi
          chmod +x cloudflared

          # QUIC (UDP-based) handles packet loss significantly better than HTTP/2 (TCP).
          # On a lossy connection, TCP stalls the entire stream waiting for retransmits.
          # QUIC drops individual datagrams and recovers per-stream — video keeps playing.
          # Falls back to http2 automatically if UDP is blocked by the network.
          TUNNEL_PROTO='${{ inputs.tunnel_protocol }}'
          nohup ./cloudflared tunnel --no-autoupdate \
            --protocol "$TUNNEL_PROTO" \
            --url "http://127.0.0.1:$GATE_PORT" \
            --logfile cloudflared.log > /dev/null 2>&1 &
          disown

          TUNNEL_URL=""
          for i in $(seq 1 60); do
            TUNNEL_URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log 2>/dev/null | head -1 || true)
            if [ -n "$TUNNEL_URL" ]; then break; fi
            sleep 2
          done

          [ -n "$TUNNEL_URL" ] || { echo "::error::Cloudflare tunnel failed to establish (protocol=$TUNNEL_PROTO)"; cat cloudflared.log; exit 1; }
          echo "Tunnel established (protocol=$TUNNEL_PROTO): $TUNNEL_URL"
          echo "url=$TUNNEL_URL" >> "$GITHUB_OUTPUT"

          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f "context=$STATUS_CONTEXT" \
            -f "target_url=$TUNNEL_URL" \
            -f "description=Building Flutter iOS application..."

      - name: Build Flutter iOS simulator application
        timeout-minutes: 60
        if: inputs.mode == 'build' && steps.appcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "Preparing Flutter dependencies..."
          flutter pub get

          # No --no-codesign: Xcode signs Simulator builds locally ("Sign to Run Locally", no team or
          # certificate needed) and embeds the Simulator entitlements. An unsigned build has no
          # application-identifier, so every Keychain call fails with -34018 (flutter_secure_storage,
          # firebase_auth, sign-in plugins...) and apps that keep their session there cannot log in.
          BUILD_ARGS=(
            ios
            --simulator
          )

          if [ '${{ inputs.build_mode }}' = 'profile' ] || [ '${{ inputs.build_mode }}' = 'release' ]; then
            echo "::warning::Flutter does not support '${{ inputs.build_mode }}' mode on iOS Simulator (physical devices only). Using --debug mode."
            BUILD_ARGS+=(--debug)
          else
            BUILD_ARGS+=(--debug)
          fi

          if [ -n '${{ inputs.flavor }}' ]; then
            BUILD_ARGS+=(--flavor '${{ inputs.flavor }}')
          fi

          if [ -n '${{ inputs.target }}' ]; then
            BUILD_ARGS+=(-t '${{ inputs.target }}')
          fi

          if [ -n '${{ inputs.dart_defines }}' ]; then
            IFS=',' read -ra DEFINES <<< '${{ inputs.dart_defines }}'
            for def in "${DEFINES[@]}"; do
              if [ -n "$def" ]; then
                BUILD_ARGS+=(--dart-define "$def")
              fi
            done
          fi

          echo "Building iOS Simulator app: flutter build ${BUILD_ARGS[*]}"
          START_TIME=$(date +%s)
          if ! flutter build "${BUILD_ARGS[@]}"; then
            echo "::error::Flutter Simulator build failed. Check the workflow logs above for Xcode/Flutter errors."
            exit 1
          fi
          END_TIME=$(date +%s)
          echo "Flutter iOS Simulator build completed in $((END_TIME - START_TIME))s"

          APP_PATH=$(find build/ios/iphonesimulator -maxdepth 2 -name '*.app' -type d | head -1)
          [ -n "$APP_PATH" ] || { echo "::error::No .app found in build/ios/iphonesimulator"; exit 1; }
          echo "Discovered generated .app bundle: $APP_PATH"

          mkdir -p build/flutter-remote-app
          cp -R "$APP_PATH" build/flutter-remote-app/

      - name: Save app build to cache
        if: inputs.mode == 'build' && inputs.cache == 'true' && steps.appcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/flutter-remote-app
          key: flutter-remote-app-${{ runner.os }}-${{ steps.fp.outputs.hash }}

      - name: Export app archive
        if: inputs.mode == 'build' && inputs.export_app == 'true'
        run: |
          set -euo pipefail
          APP_PATH=$(find build/flutter-remote-app -maxdepth 2 -name '*.app' -type d | head -1)
          [ -n "$APP_PATH" ] || { echo "::error::No .app found to export"; exit 1; }
          APP_NAME=$(basename "$APP_PATH")
          tar -czf "build/${APP_NAME}.tar.gz" -C build/flutter-remote-app "$APP_NAME"

      - name: Upload app artifact
        if: inputs.mode == 'build' && inputs.export_app == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-remote-app-${{ inputs.session }}
          path: build/*.app.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Install and launch Flutter app
        timeout-minutes: 15
        if: inputs.mode == 'build'
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          APP_PATH=$(find build/flutter-remote-app -maxdepth 2 -name '*.app' -type d | head -1)
          [ -n "$APP_PATH" ] || { echo "::error::No .app found in build/flutter-remote-app"; exit 1; }

          echo "Installing $APP_PATH onto simulator $UDID..."
          xcrun simctl install "$UDID" "$APP_PATH"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" 2>/dev/null || true)
          if [ -z "$BUNDLE_ID" ]; then
            BUNDLE_ID=$(defaults read "$APP_PATH/Info" CFBundleIdentifier 2>/dev/null || true)
          fi
          [ -n "$BUNDLE_ID" ] || { echo "::error::Could not determine CFBundleIdentifier from $APP_PATH/Info.plist"; exit 1; }
          echo "Detected Bundle Identifier: $BUNDLE_ID"

          echo "Launching Flutter application ($BUNDLE_ID)..."
          if ! xcrun simctl launch "$UDID" "$BUNDLE_ID"; then
            echo "::error::Flutter application was built successfully, but failed to launch inside the iOS Simulator."
            exit 1
          fi
          echo "Flutter application launched successfully inside iOS Simulator."

      - name: Install prebuilt app
        timeout-minutes: 15
        if: inputs.mode == 'app'
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          APP_URL: ${{ inputs.app_url }}
          APP_RELEASE_ASSET: ${{ inputs.app_release_asset }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/flutter-remote-prebuilt
          cd /tmp/flutter-remote-prebuilt

          if [ -n "$APP_RELEASE_ASSET" ]; then
            echo "Downloading prebuilt app from GitHub Release: $APP_RELEASE_ASSET"
            gh release download flutter-remote-build -p "$APP_RELEASE_ASSET"
            ARCHIVE="$APP_RELEASE_ASSET"
          elif [ -n "$APP_URL" ]; then
            echo "Downloading prebuilt app from URL: $APP_URL"
            curl -fsSL "$APP_URL" -o app-archive
            ARCHIVE="app-archive"
          else
            echo "::error::Neither app_url nor app_release_asset provided for mode=app"
            exit 1
          fi

          if file "$ARCHIVE" | grep -qiE 'gzip|tar'; then
            tar -xzf "$ARCHIVE" || tar -xf "$ARCHIVE"
          elif file "$ARCHIVE" | grep -qi 'zip'; then
            unzip -q "$ARCHIVE"
          fi

          PREBUILT_APP=$(find . -maxdepth 3 -name '*.app' -type d | head -1)
          [ -n "$PREBUILT_APP" ] || { echo "::error::No .app bundle discovered in downloaded archive"; exit 1; }

          # Validate that it is a simulator app
          PLATFORMS=$(/usr/libexec/PlistBuddy -c "Print :CFBundleSupportedPlatforms" "$PREBUILT_APP/Info.plist" 2>/dev/null || true)
          if [ -n "$PLATFORMS" ] && ! echo "$PLATFORMS" | grep -qi 'iPhoneSimulator'; then
            echo "::error::This is a device iOS build. flutter-remote requires an iOS Simulator build."
            exit 1
          fi

          xcrun simctl install "$UDID" "$PREBUILT_APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PREBUILT_APP/Info.plist" 2>/dev/null || defaults read "$PREBUILT_APP/Info" CFBundleIdentifier)
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          echo "Prebuilt app launched."

      - name: Report simulator live
        run: |
          TUNNEL_URL='${{ steps.tunnel.outputs.url }}'
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f "context=$STATUS_CONTEXT" \
            -f "target_url=$TUNNEL_URL" \
            -f "description=Flutter Simulator is live"

      - name: Install agent-device
        id: ad
        if: inputs.agent_device == 'true'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          echo "Installing agent-device v${{ inputs.agent_device_version }}..."
          npm install -g "agent-device@${{ inputs.agent_device_version }}"

      - name: Start agent-device proxy
        if: inputs.agent_device == 'true'
        timeout-minutes: 10
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          agent-device proxy --port "$AGENT_PORT" --device "$UDID" &
          for i in {1..30}; do
            if nc -z 127.0.0.1 "$AGENT_PORT" 2>/dev/null; then break; fi
            sleep 0.2
          done
          echo "agent-device proxy running on port $AGENT_PORT"

      - name: Hold the stream open
        run: |
          MINUTES='${{ inputs.minutes }}'
          echo "Stream is active. Holding session open for $MINUTES minutes..."
          tail -f webrtc-peer.log gate.log &
          TAIL_PID=$!
          sleep $((MINUTES * 60))
          kill $TAIL_PID 2>/dev/null || true

      - name: Mark session ended
        if: always()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f "context=$STATUS_CONTEXT" \
            -f "description=Simulator session ended" || true
